version: 2
updates:
  # GitHub Actions — keeps the SHA-pinned action versions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # Add a language ecosystem here once the repository layout is settled and
  # there is a manifest to track. Pointing Dependabot at a directory that does
  # not exist produces a recurring config error, so nothing is listed yet.
